spring:
  application:
    name: barbearia
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbearia}
    username: ${DB_USER:barbearia}
    password: ${DB_PASSWORD:barbearia}

barbearia:
  jwt:
    secret: ${JWT_SECRET:chave-dev-insegura-trocar-em-producao-0123456789abcdef}
    expiracao-dias: 7
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}
